# Runner configuration for train_framework_qwen25_reward_dpo.py.
# Each round writes a standard LLaMA-Factory DPO config after reward ranking.
data_root: /root/JZY/agent-threat-mining/data/inner_representation_v2
output_root: /root/JZY/agent-threat-mining/artifacts/threat_framework_qwen25_reward_rl
model_name_or_path: /root/JZY/MCP_Threat_Modeling/Qwen2.5-7B
start_adapter_path: ""
device: cuda
torch_dtype: bfloat16
rounds: 3
test_size: 20
sample_size: 1
sample_seed: 7
samples_per_prompt: 4
max_new_tokens: 1800
policy_temperature: 0.35
policy_top_p: 0.9
max_policy_prompt_chars: 26000
min_preference_gap: 0.02
accept_reward_delta: 0.001
evaluate_test_every: 1
run_llamafactory_dpo: true
llamafactory_cli: llamafactory-cli
llamafactory_dataset_name: threat_framework_reward_dpo
dpo_cutoff_len: 8192
dpo_quantization_bit: 4
dpo_learning_rate: 5.0e-5
dpo_epochs: 1.0
dpo_batch_size: 1
dpo_gradient_accumulation: 8
dpo_lora_rank: 16
dpo_lora_alpha: 32
dpo_lora_dropout: 0.05
dpo_beta: 0.1
deepseek_model: deepseek-chat
temperature: 0.0
openclaw_runtime_eval: true
openclaw_max_cases: 1
openclaw_strict_attack_eval: true
openclaw_inject_skill: true
openclaw_stage_skill: true
openclaw_restrict_tools: true
